<!doctype html>
<html lang="${languageCode?html}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>${title?html}</title>
  <meta name="description" content="${description?html}">
  <link rel="canonical" href="${canonicalUrl?html}">
  <#list alternates as alternate><link rel="alternate" hreflang="${alternate.languageCode?html}" href="${alternate.url?html}">
  </#list><link rel="alternate" hreflang="x-default" href="${xDefaultUrl?html}">
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="results-page">
  <header class="search-header">
    <a class="wordmark" href="index.html">${siteName?html}</a>
    <nav class="language-switch" aria-label="${languagePicker?html}"><#list alternates as alternate><a lang="${alternate.languageCode?html}" hreflang="${alternate.languageCode?html}" href="${alternate.url?html}">${alternate.displayName?html}</a><#sep> · </#sep></#list></nav>
    <form id="result-search-form" class="search-form" action="result.html" method="get">
      <input id="query" name="q" type="search" required placeholder="${searchPlaceholder?html}" autocomplete="off">
      <button type="submit">${searchButton?html}</button>
    </form>
  </header>
  <main class="results-main">
    <h1 id="result-heading">${resultsTitle?html}</h1>
    <p id="status" aria-live="polite">${loading?html}</p>
    <div id="results"></div>
    <nav id="pagination" aria-label="${resultsTitle?html}"></nav>
  </main>
  <script id="page-messages" type="application/json">${pageMessagesJson}</script>
  <script src="../app.js"></script>
</body>
</html>
