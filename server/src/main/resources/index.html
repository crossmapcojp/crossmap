<!doctype html>
<html lang="${languageCode?html}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>${title?html}</title>
  <meta name="description" content="${description?html}">
  <link rel="canonical" href="${canonicalUrl?html}">
  <#list alternates as alternate><link rel="alternate" hreflang="${alternate.languageCode?html}" href="${alternate.url?html}">
  </#list><link rel="alternate" hreflang="x-default" href="${xDefaultUrl?html}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="${title?html}">
  <meta property="og:description" content="${description?html}">
  <meta property="og:url" content="${canonicalUrl?html}">
  <meta property="og:locale" content="${ogLocale?html}">
  <link rel="stylesheet" href="<#if rootEntry>styles.css<#else>../styles.css</#if>">
</head>
<body class="home-page">
  <main class="home-main">
    <nav class="language-switch" aria-label="${languagePicker?html}"><#list alternates as alternate><a lang="${alternate.languageCode?html}" hreflang="${alternate.languageCode?html}" href="${alternate.url?html}">${alternate.displayName?html}</a><#sep> · </#sep></#list></nav>
    <p class="wordmark">${siteName?html}</p>
    <h1>${heading?html}</h1>
    <form id="search-form" class="search-form" action="<#if rootEntry>en/result.html<#else>result.html</#if>" method="get">
      <input id="query" name="q" type="search" required placeholder="${searchPlaceholder?html}">
      <button type="submit">${searchButton?html}</button>
    </form>
  </main>
  <script src="<#if rootEntry>app.js<#else>../app.js</#if>"></script>
</body>
</html>
