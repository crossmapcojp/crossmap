# Crossmap's repository-local Neo4j Community instance.
# Invoke it through scripts/neo4j-local.sh so relative paths resolve from the repository root.
server.directories.data=cache/neo4j-data/data
server.directories.transaction.logs.root=cache/neo4j-data/transactions
server.directories.logs=cache/neo4j-data/logs
server.directories.run=cache/neo4j-data/run
server.directories.import=cache/neo4j-data/import
server.directories.plugins=cache/neo4j-data/plugins
server.directories.lib=/usr/share/neo4j/lib

server.default_listen_address=127.0.0.1
server.default_advertised_address=localhost
server.bolt.enabled=true
server.bolt.listen_address=:7687
server.bolt.advertised_address=:7687
server.http.enabled=true
server.http.listen_address=:7474
server.http.advertised_address=:7474
server.https.enabled=false

dbms.security.auth_enabled=true
server.memory.heap.initial_size=512m
server.memory.heap.max_size=1g
